<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profiling Fixture</title>
    <style>
        :root { --ink: #0b1f3a; --paper: #f5f7fb; --pad: clamp(24px, 6vh, 72px); }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
        .site-header { padding: 16px 24px; border-bottom: 1px solid rgba(11, 31, 58, 0.15); }
        nav { display: flex; gap: 24px; }
        nav a { color: var(--ink); text-decoration: none; }
        .hero { background: #0b1f3a; color: #f5f7fb; padding: clamp(24px, 6vh, 72px) 24px; }
        .hero h1 { margin: 0 0 12px; font-size: clamp(32px, 5vw, 64px); }
        .hero p { margin: 0; font-size: 18px; opacity: 0.9; }
        .site-footer { background: #0b1f3a; color: #f5f7fb; padding: var(--pad) 24px; font-size: 14px; }
        @media (max-width: 600px) { .hero h1 { font-size: 28px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Profiling Fixture</h1>
        <p>A tiny workspace that drives the profiling harness.</p>
    </section>
    <footer class="site-footer">
        <p>© Profiling Fixture</p>
    </footer>
</body>
</html>
