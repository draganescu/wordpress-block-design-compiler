<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AVVR Provided Markup Compare</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #041914;
        color: #fff7f2;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .compare-shell {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        min-height: 100vh;
      }

      .compare-pane {
        min-width: 0;
        border-right: 1px solid rgba(255, 247, 242, 0.24);
      }

      .compare-pane:last-child {
        border-right: 0;
      }

      .compare-title {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        height: 44px;
        padding: 0 0.85rem;
        border-bottom: 1px solid rgba(255, 247, 242, 0.24);
        background: #041914;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .compare-title a {
        color: #e34248;
        text-decoration: none;
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 44px);
        border: 0;
        background: #fff7f2;
      }

      @media (max-width: 900px) {
        .compare-shell {
          grid-template-columns: 1fr;
        }

        .compare-pane {
          border-right: 0;
          border-bottom: 1px solid rgba(255, 247, 242, 0.24);
        }

        iframe {
          height: 86vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="compare-shell">
      <section class="compare-pane">
        <div class="compare-title">
          <span>Live AVVR</span>
          <a href="https://avvr.nl/">open</a>
        </div>
        <iframe title="Live AVVR site" src="https://avvr.nl/"></iframe>
      </section>
      <section class="compare-pane">
        <div class="compare-title">
          <span>Block Render</span>
          <a href="./rendered/rendered-blocks.html">open</a>
        </div>
        <iframe title="AVVR rendered block output" src="./rendered/rendered-blocks.html"></iframe>
      </section>
      <section class="compare-pane">
        <div class="compare-title">
          <span>Editable Blocks</span>
          <a href="./editor/block-editor.html">open</a>
        </div>
        <iframe title="AVVR editable block editor" src="./editor/block-editor.html"></iframe>
      </section>
    </main>
  </body>
</html>
