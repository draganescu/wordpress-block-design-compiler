    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      .wbdc-editor-shell {
        min-height: 100vh;
        background: inherit;
      }

      .wbdc-editor-toolbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        min-height: 44px;
        padding: 0 12px;
        border-bottom: 1px solid #333;
        background: #181818;
        color: #f7f1df;
        font: 700 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .wbdc-editor-toolbar a {
        color: #d7ff38;
        text-decoration: none;
      }

      .wbdc-editor-canvas {
        min-height: calc(100vh - 44px);
      }

      .block-editor-inner-blocks {
        display: contents;
      }

      .is-root-container.block-editor-block-list__layout {
        padding: 0;
      }

      .block-editor-block-list__block {
        margin-top: 0;
        margin-bottom: 0;
      }

      .is-root-container > .block-editor-block-list__block {
        max-width: none;
      }

      .block-editor-block-list__layout .block-editor-block-list__block::before {
        outline-color: rgba(215, 255, 56, 0.65);
      }

      .components-placeholder,
      .block-editor-block-variation-picker,
      .block-editor-default-block-appender,
      .block-editor-block-list__empty-block-inserter {
        display: none !important;
      }

      .wbdc-editor-error {
        margin: 0;
        padding: 24px;
        color: #ffe6e6;
        background: #290d0d;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
