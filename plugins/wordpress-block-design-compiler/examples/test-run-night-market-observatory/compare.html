<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Night Market Observatory: Mockup vs Block Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111;
        color: #f7f1df;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        height: 44px;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        border-bottom: 1px solid #333;
        background: #333;
      }

      header a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #181818;
        color: #f7f1df;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
      }

      main {
        display: grid;
        height: calc(100vh - 44px);
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: #333;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./mockup/index.html" target="_blank"><span>Mockup</span><span>source HTML/CSS</span></a>
      <a href="./editor/block-editor.html" target="_blank"><span>Block editor</span><span>editable block tree</span></a>
    </header>
    <main>
      <iframe title="Mockup" src="./mockup/index.html"></iframe>
      <iframe title="Editable WordPress block tree" src="./editor/block-editor.html"></iframe>
    </main>
  </body>
</html>
